<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 660" width="660" height="660">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19c88a"/><stop offset="0.5" stop-color="#2fd0a3"/><stop offset="1" stop-color="#20b5c9"/>
    </linearGradient>
    <path id="arcTop" d="M 92 330 A 238 238 0 0 1 568 330"/>
    <path id="arcBottom" d="M 568 330 A 238 238 0 0 1 92 330"/>
  </defs>
  <!-- outer ring -->
  <circle cx="330" cy="330" r="322" fill="url(#ring)"/>
  <circle cx="330" cy="330" r="322" fill="none" stroke="#0c6b63" stroke-width="4"/>
  <circle cx="330" cy="330" r="200" fill="#ffffff" stroke="#0c6b63" stroke-width="3"/>
  <!-- ring text -->
  <text font-family="'Noto Naskh Arabic','Amiri','Traditional Arabic','Scheherazade',Tahoma,sans-serif" font-size="52" font-weight="700" fill="#2b2f86" direction="rtl">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">الجامعة المستنصرية / كلية الهندسة</textPath>
  </text>
  <text font-family="'Noto Naskh Arabic','Amiri','Traditional Arabic','Scheherazade',Tahoma,sans-serif" font-size="52" font-weight="700" fill="#2b2f86" direction="rtl">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">قسم هندسة الموارد المائية</textPath>
  </text>
  <!-- dam emblem -->
  <g transform="translate(330,330)">
    <!-- side piers -->
    <polygon points="-152,-120 -112,-120 -92,-16 -132,-16" fill="#4a4a4a"/>
    <polygon points="112,-120 152,-120 132,-16 92,-16" fill="#4a4a4a"/>
    <polygon points="-112,-120 -92,-16 -78,-16 -100,-120" fill="#8a8a8a"/>
    <polygon points="92,-120 112,-120 100,-16 78,-16" fill="#8a8a8a"/>
    <!-- crest beam -->
    <rect x="-168" y="-60" width="336" height="62" fill="#5a5a5a"/>
    <rect x="-168" y="-60" width="336" height="10" fill="#8f8f8f"/>
    <!-- water jets -->
    <g fill="#3a1fb8">
      <path d="M-70,10 h28 l6,100 h-40 z"/>
      <path d="M-14,10 h28 l6,100 h-40 z"/>
      <path d="M42,10 h28 l6,100 h-40 z"/>
    </g>
    <!-- gates: three inverted-U arches -->
    <g fill="none" stroke="#f3e63c" stroke-width="12" stroke-linecap="round">
      <path d="M-62,-10 v-98 a16,16 0 0 1 32,0 v98"/>
      <path d="M-6,-10 v-98 a16,16 0 0 1 32,0 v98"/>
      <path d="M50,-10 v-98 a16,16 0 0 1 32,0 v98"/>
    </g>
    <g fill="none" stroke="#b9ad1a" stroke-width="3" stroke-linecap="round">
      <path d="M-62,-10 v-98 a16,16 0 0 1 32,0 v98"/>
      <path d="M-6,-10 v-98 a16,16 0 0 1 32,0 v98"/>
      <path d="M50,-10 v-98 a16,16 0 0 1 32,0 v98"/>
    </g>
  </g>
</svg>
